[project]
name = "medication-log-api"
version = "0.1.0"
description = "REST API for a personal medication and health condition log, with read-only sharing between accounts."
readme = "README.md"
authors = [
    { name = "Thaís Moreira"}
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "environs[django]>=15.1.0",
    "granian>=2.8.2",
    "psycopg[binary]>=3.3.5",
]

[project.scripts]
medication-log-api = "medication_log_api:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "UP", "C4"]

[tool.ruff.format]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.14"
files = ["src"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings"
